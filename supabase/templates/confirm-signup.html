<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your SnapX sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#F5F2EC;color:#1E1B17;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F2EC;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFDF8;border:1px solid #E2DBCF;border-radius:12px;padding:32px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6B6459;">SnapX</p>
              <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2;font-weight:600;">Your SnapX sign-in code</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.6;">Use this code to sign in to SnapX:</p>
              <p style="margin:0 0 20px;font-family:'Courier New',monospace;font-size:36px;line-height:1.2;letter-spacing:10px;font-weight:700;color:#C8432A;">{{ .Token }}</p>
              <p style="margin:0 0 12px;font-size:16px;line-height:1.6;">Enter it on the sign-in page. The code expires in 10 minutes.</p>
              <p style="margin:0;font-size:14px;line-height:1.6;color:#6B6459;">If you didn't ask for this email, you can ignore it.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
