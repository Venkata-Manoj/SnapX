<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="@@BASE@@" aria-label="{{BRAND_NAME}}, home">
      <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
        <line x1="30" y1="30" x2="98" y2="98" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>
        <line x1="30" y1="98" x2="60" y2="68" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>
        <rect x="71.9" y="43.1" width="13" height="13" rx="2.6" fill="currentColor"/>
        <rect x="83" y="35" width="10" height="10" rx="2" fill="currentColor"/>
        <rect x="92" y="28" width="8" height="8" rx="1.6" fill="currentColor" opacity="0.8"/>
        <rect x="99.5" y="19.5" width="9" height="9" rx="1.8" fill="#C8432A"/>
      </svg>
      <span class="brand-word">{{BRAND_NAME}}</span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="@@BASE@@#how">How it works</a></li>
        <li><a href="@@BASE@@#effects">Effects</a></li>
        <li><a href="@@BASE@@pricing.html">Pricing</a></li>
        <li><a href="@@BASE@@#install">Install</a></li>
        <li><a href="@@BASE@@#faq">FAQ</a></li>
        <li><a href="@@BASE@@changelog.html">Changelog</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- @if AUTH_ENABLED -->
      <a class="header-signin" href="{{LOGIN_URL}}" data-auth-signedout>Sign in</a>

      <div class="user-menu" data-user-menu hidden>
        <button class="user-btn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="user-panel" data-user-toggle>
          <span class="avatar" data-user-avatar aria-hidden="true"></span>
          <span class="visually-hidden" data-user-label>Account menu</span>
          <svg class="user-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-panel" id="user-panel" role="menu" aria-label="Account" hidden data-user-panel>
          <p class="user-panel__id">
            <span class="user-panel__name" data-user-name></span>
            <span class="user-panel__email mono" data-user-email></span>
          </p>
          <a role="menuitem" href="@@BASE@@account.html">Account</a>
          <a role="menuitem" href="@@BASE@@pricing.html">Pricing</a>
          <button role="menuitem" type="button" data-signout>Sign out</button>
        </div>
      </div>
      <!-- @endif -->
      <!-- @if CHROME_WEB_STORE_URL -->
      <a class="btn btn--primary btn--compact" href="{{CHROME_WEB_STORE_URL}}">Add to Chrome</a>
      <!-- @endif -->
      <!-- @ifnot CHROME_WEB_STORE_URL -->
      <button class="btn btn--primary btn--compact" type="button" aria-disabled="true">Coming soon to Chrome Web Store</button>
      <!-- @endif -->
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu" data-menu-open>
        <span class="visually-hidden">Open menu</span>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M4 8h16M4 16h16"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="menu-sheet" id="mobile-menu" data-menu hidden>
  <div class="menu-sheet__top container">
    <a class="brand" href="@@BASE@@" aria-label="{{BRAND_NAME}}, home">
      <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
        <line x1="30" y1="30" x2="98" y2="98" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>
        <line x1="30" y1="98" x2="60" y2="68" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>
        <rect x="71.9" y="43.1" width="13" height="13" rx="2.6" fill="currentColor"/>
        <rect x="83" y="35" width="10" height="10" rx="2" fill="currentColor"/>
        <rect x="92" y="28" width="8" height="8" rx="1.6" fill="currentColor" opacity="0.8"/>
        <rect x="99.5" y="19.5" width="9" height="9" rx="1.8" fill="#C8432A"/>
      </svg>
      <span class="brand-word">{{BRAND_NAME}}</span>
    </a>
    <button class="menu-btn" type="button" data-menu-close>
      <span class="visually-hidden">Close menu</span>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <nav class="menu-sheet__nav container" aria-label="Mobile">
    <a href="@@BASE@@#how">How it works</a>
    <a href="@@BASE@@#effects">Effects</a>
    <a href="@@BASE@@pricing.html">Pricing</a>
    <a href="@@BASE@@#install">Install</a>
    <a href="@@BASE@@#faq">FAQ</a>
    <a href="@@BASE@@changelog.html">Changelog</a>
  </nav>

  <div class="menu-sheet__foot container">
    <!-- @if AUTH_ENABLED -->
    <a class="menu-sheet__signin" href="{{LOGIN_URL}}" data-auth-signedout>Sign in</a>
    <a class="menu-sheet__account" href="@@BASE@@account.html" data-auth-signedin hidden>Account</a>
    <!-- @endif -->
    <!-- @if CHROME_WEB_STORE_URL -->
    <a class="btn btn--primary" href="{{CHROME_WEB_STORE_URL}}">Add to Chrome</a>
    <!-- @endif -->
    <!-- @ifnot CHROME_WEB_STORE_URL -->
    <button class="btn btn--primary" type="button" aria-disabled="true">Coming soon to Chrome Web Store</button>
    <!-- @endif -->
    <p class="mono muted">Chrome {{CHROME_MIN_VERSION}}+</p>
  </div>
</div>
